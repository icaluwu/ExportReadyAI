openapi: 3.0.3
info:
  title: ExportReadyAI Mobile API
  version: 1.0.0
  description: Official mobile API contract for ExportReadyAI native applications.
paths:
  /api/mobile/v1/guest-session:
    post:
      summary: Generate a guest session token
      responses:
        '200':
          description: Guest session created
  /api/mobile/v1/analyze:
    post:
      summary: Submit export assessment for AI analysis and readiness scoring
      responses:
        '200':
          description: Assessment completed successfully
  /api/mobile/v1/hs-code:
    post:
      summary: Get AI HS Code recommendations
      responses:
        '200':
          description: HS code recommendations returned
  /api/mobile/v1/chat:
    post:
      summary: AI Consultant interaction
      responses:
        '200':
          description: AI response generated
  /api/mobile/v1/assessments:
    get:
      summary: Retrieve assessment history for authenticated user
      responses:
        '200':
          description: History list returned
  /api/mobile/v1/assessments/{id}:
    get:
      summary: Get detailed assessment report
      responses:
        '200':
          description: Assessment details returned
  /api/mobile/v1/roadmap/{assessmentId}:
    get:
      summary: Retrieve interactive roadmap checklist
      responses:
        '200':
          description: Roadmap checklist returned
  /api/mobile/v1/subscription:
    get:
      summary: Check active user subscription & entitlements
      responses:
        '200':
          description: Subscription details returned
  /api/mobile/v1/payment/midtrans:
    post:
      summary: Create Midtrans transaction for mobile client
      responses:
        '200':
          description: Midtrans Snap URL / token created
